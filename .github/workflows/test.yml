name: Python Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1   # setup-uv 는 v7 이후 부동 메이저 태그(@v10)를 만들지 않는다
      - name: Install dependencies
        run: uv sync --dev
      - name: Run tests (network 0)
        run: uv run pytest -q
